{% extends "layout.html" %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 0 auto;">
    <h1><span>Init</span> Logic</h1>

    {% if qr_uri %}
    <div style="text-align: center; margin-bottom: 2rem;">
        <p style="margin-bottom: 1rem; color: #fff;">Scan this with Google Authenticator</p>
        <div style="background: white; padding: 1rem; border-radius: 1rem; display: inline-block; max-width: 100%;">
            <img src="{{ url_for('static', filename='qr_code.png') }}" alt="QR Code"
                style="max-width: 100%; height: auto; display: block;">
        </div>
    </div>
    <form action="{{ url_for('login') }}" method="GET">
        <button class="btn">I've Scanned It, Let me Login</button>
    </form>
    {% else %}
    <form action="{{ url_for('register') }}" method="POST">
        <div class="form-group">
            <label for="username">Create Username</label>
            <input type="text" id="username" name="username" required placeholder="Pick a username">
        </div>
        <div class="form-group">
            <label for="password">Create Master Password</label>
            <input type="password" id="password" name="password" required placeholder="Choose a strong password">
        </div>

        <button type="submit" class="btn">Generate Keys & Setup 2FA</button>
    </form>
    <div class="auth-switch">
        Already setup? <a href="{{ url_for('login') }}">Login</a>
    </div>
    {% endif %}
</div>
{% endblock %}
