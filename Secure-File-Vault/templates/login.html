{% extends "layout.html" %}

{% block content %}
<div class="card" style="max-width: 400px; margin: 0 auto;">
    <h1><span>Secure</span> Vault</h1>
    <h2 style="font-size: 1.2rem; font-weight: 400; color: var(--text-muted); margin-bottom: 2rem;">Login to access your
        files</h2>

    <form action="{{ url_for('login') }}" method="POST">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required placeholder="Enter your username">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required placeholder="Enter your password">
        </div>

        <div class="form-group">
            <label for="otp">Authenticator Code (2FA)</label>
            <input type="text" id="otp" name="otp" required placeholder="000 000" maxlength="6" pattern="\d*">
        </div>

        <button type="submit" class="btn">Unlock Vault <i class="fas fa-lock-open"></i></button>
    </form>

    <div class="auth-switch">
        First time here? <a href="{{ url_for('register') }}">Initialize Vault</a>
    </div>
</div>
{% endblock %}
